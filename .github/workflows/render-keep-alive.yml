name: Keep Render Services Alive (8am-5pm CT)

on:
  schedule:
    # Every 10 min, 8:00am–5:50pm Central Daylight Time (13:00–21:59 UTC)
    - cron: '*/10 13-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service 1
        run: curl -s -o /dev/null -w "Service 1: %{http_code}\n" "${{ secrets.RENDER_URL_1 }}"
      - name: Ping Render service 2
        run: curl -s -o /dev/null -w "Service 2: %{http_code}\n" "${{ secrets.RENDER_URL_2 }}"
